<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>


        <!-- Summary -->

        <div class="summary">

            <div>
                <h3>Total Income</h3>
                <p id="income">₹0</p>
            </div>

            <div>
                <h3>Total Expense</h3>
                <p id="expense">₹0</p>
            </div>

            <div>
                <h3>Balance</h3>
                <p id="balance">₹0</p>
            </div>

        </div>

<div class="monthly-section">

    <h2>Monthly Summary</h2>

    <div class="month-selector">

        <select id="monthSelect" onchange="updateMonthlySummary()">

            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>

        </select>


        <select id="yearSelect" onchange="updateMonthlySummary()">

            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>

        </select>

    </div>


    <div class="monthly-summary">

        <div>
            <h3>Income</h3>
            <p id="monthlyIncome">₹0</p>
        </div>

        <div>
            <h3>Expenses</h3>
            <p id="monthlyExpense">₹0</p>
        </div>

        <div>
            <h3>Transactions</h3>
            <p id="monthlyTransactions">0</p>
        </div>

    </div>

</div>
        <!-- Budget and Add Transaction -->

        <div class="form">

            <h2>Monthly Budget</h2>

            <input
                type="number"
                id="budget"
                placeholder="Enter Monthly Budget"
            >

            <button onclick="saveBudget()">Save Budget</button>

            <p id="budgetStatus">Budget: ₹0</p>

            <hr>


            <h2>Add Transaction</h2>

            <input
                type="text"
                id="description"
                placeholder="Description"
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount"
            >

            <select id="type">

                <option value="expense">Expense</option>

                <option value="income">Income</option>

            </select>


            <select id="category">

                <option value="">Select Category</option>

                <option value="Food">Food</option>

                <option value="Shopping">Shopping</option>

                <option value="Transport">Transport</option>

                <option value="Bills">Bills</option>

                <option value="Entertainment">Entertainment</option>

                <option value="Other">Other</option>

            </select>


            <label for="date" class="date-label">Date</label>
<input type="date" id="date">


            <button onclick="addTransaction()">
                Add Transaction
            </button>

        </div>


        <!-- Transaction History -->

        <div class="transactions">

    <h2>Transaction History</h2>

    <input
        type="text"
        id="search"
        placeholder="Search transactions..."
        oninput="displayAllTransactions()"
    >

    <ul id="transactionList"></ul>

</div>

        <!-- Expense Chart -->

        <div class="chart-container">

            <h2>Expense Breakdown</h2>

            <canvas id="expenseChart"></canvas>

        </div>

    </div>


    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Our JavaScript -->

    <script src="script.js"></script>

</body>

</html>
